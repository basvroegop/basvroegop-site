name: Publiceer basvroegop.nl

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Haal repository op
        uses: actions/checkout@v6

      - name: Bouw site met Hugo
        run: ./build.sh

      - name: Upload Pages-artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publiceer naar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
