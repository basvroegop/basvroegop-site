# basvroegop.nl: Hugo met het Anatole-thema. De map content/ is ook de Obsidian-map;
# de artikelen blijven gewone Obsidian-markdown en worden hier alleen anders gelezen.
baseURL = "https://basvroegop.nl/"
title = "Bastiaan Vroegop"
theme = "anatole"
defaultContentLanguage = "nl"
locale = "nl-NL"
enableRobotsTXT = true
summaryLength = 40
timeout = "120s"

[pagination]
  pagerSize = 20

[services.rss]
  limit = 50

# De artikelen gebruiken `published` en `modified` in plaats van Hugo's eigen velden.
[frontmatter]
  date = ["published", "date", "publishDate"]
  publishDate = ["published", "publishDate"]
  lastmod = ["modified", "lastmod"]

[taxonomies]
  tag = "tags"

[markup.goldmark.renderer]
  unsafe = true

[module]
  # Afbeeldingen staan in content/media (naast de notities in Obsidian) en worden als
  # statische bestanden onder /media geserveerd.
  [[module.mounts]]
    source = "content"
    target = "content"
    files = ["! media/**"]
  [[module.mounts]]
    source = "content/media"
    target = "static/media"
  # Ook als assets, zodat render-image een kale bestandsnaam kan opzoeken: Obsidian kort
  # afbeeldingslinks bij het verplaatsen van een notitie in tot alleen de bestandsnaam.
  [[module.mounts]]
    source = "content/media"
    target = "assets/media"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static"
    target = "static"

# Alle artikelen zijn voor het thema een "post": dan toont het de publicatiedatum op de
# artikelpagina en komen ook de stukken uit de hoofdmap in de lijst met recente publicaties.
# Losse pagina's (over-mij) zetten zelf `type: page`.
[[cascade]]
  type = "post"
  [cascade.target]
    kind = "page"

[params]
  title = "Bastiaan Vroegop"
  author = "Bastiaan Vroegop"
  description = "Ik ben onderzoeksjournalist bij Dagblad van het Noorden en Leeuwarder Courant. Daarnaast schrijf ik over videogames voor NRC Handelsblad, Unpause en Kidsweek. Eerder maakte ik verhalen voor o.a. NU.nl, AD, Gamer.nl, Power Unlimited en Bright."
  profilePicture = "images/profile.webp"
  images = ["images/profile.webp"]
  mainSections = ["post"]
  customCss = ["css/archief.css"]
  doNotLoadAnimations = true
  # Koppen letterlijk tonen; het thema zet titels anders In Hoofdletters Per Woord.
  disableTitleCapitalization = true
  disableArchiveTitleStyling = true
  # Nederlandse maandnamen in plaats van Engelse.
  localizedDates = true
  reversepagetitle = true
  singleDateFormat = "2 January 2006"
  indexDateFormat = "2 January 2006"
  listDateFormat = "2 January 2006"

[menus]
  [[menus.main]]
    name = "Home"
    pageRef = "/"
    weight = 10
  [[menus.main]]
    name = "Recensies"
    pageRef = "/recensies"
    weight = 20
  [[menus.main]]
    name = "Interviews"
    pageRef = "/interviews"
    weight = 30
  [[menus.main]]
    name = "Achtergronden"
    pageRef = "/achtergronden"
    weight = 40
  [[menus.main]]
    name = "Over mij"
    pageRef = "/over-mij"
    weight = 50
